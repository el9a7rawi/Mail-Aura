name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --test tests/
      - run: node scripts/check-ui.mjs
      - run: |
          for f in ui.js background.js content.js i18n.js lib/*.js ui/*.js scripts/*.mjs; do
            node --check "$f"
          done
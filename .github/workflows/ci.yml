name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate extension metadata and locales
        run: |
          node -e "
          const fs = require('fs');
          const manifest = JSON.parse(fs.readFileSync('manifest.json', 'utf8'));
          const paths = [manifest.action.default_popup, manifest.side_panel.default_path, manifest.background.service_worker, ...Object.values(manifest.icons), ...Object.values(manifest.action.default_icon)];
          for (const p of paths) if (!fs.existsSync(p)) throw new Error('missing ' + p);
          const langs = ['en','es','fr','de','pt-BR','ru','ar','zh-CN'];
          const base = Object.keys(JSON.parse(fs.readFileSync('locales/en.json', 'utf8'))).sort().join('|');
          for (const code of langs) {
            const keys = Object.keys(JSON.parse(fs.readFileSync('locales/' + code + '.json', 'utf8'))).sort().join('|');
            if (keys !== base) throw new Error('locale key mismatch: ' + code);
          }
          const imports = ['ui/result-row.js','ui/theme.js','ui/cselect.js','i18n.js','lib/autofix.js','lib/corrections.js','lib/csv.js','lib/local-brain.js','lib/settings.js','lib/validation.js','lib/orchestrator.js'];
          for (const p of imports) if (!fs.existsSync(p)) throw new Error('missing static import ' + p);
          const en = JSON.parse(fs.readFileSync('locales/en.json', 'utf8'));
          for (const html of fs.readdirSync('.').filter(f => f.endsWith('.html'))) {
            const text = fs.readFileSync(html, 'utf8');
            if (/<script(?![^>]*\bsrc=)/iu.test(text)) throw new Error(html + ': inline script violates the CSP');
            for (const m of text.matchAll(/data-i18n=\x22([^\x22]+)\x22/g)) if (!(m[1] in en)) throw new Error(html + ': missing key ' + m[1]);
          }
          const bundled = ['privacy.js', 'fonts/inter-latin.woff2', 'fonts/cairo-arabic.woff2', 'fonts/OFL.txt'];
          for (const p of bundled) if (!fs.existsSync(p)) throw new Error('missing bundled asset ' + p);
          console.log('OK ' + paths.length + ' manifest files, ' + langs.length + ' locales, ' + imports.length + ' imports');
          "
